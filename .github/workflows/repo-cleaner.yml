name: Repo Cleaner
permissions:
  actions: write

on:
  schedule:
    - cron: '26 11 */10 * *'  # every 10 days
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          retain_days: 15
          keep_minimum_runs: 5
