repos:
  - repo: https://github.com/rsb-23/trun
    rev: v0.0.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: [ -b, main, -b, master ]
